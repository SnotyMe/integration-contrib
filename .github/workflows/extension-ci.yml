on:
  push:
    tags:
      - '*_*.*.*' # match tags like autoscout_1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Extension
        id: build
        run: |
          tag='${{ github.ref_name }}'
          extension="${tag%%_*}"
          version="${tag#*_}"

          gradle_version="$(./gradlew -q ":extension:$extension:version")"
          if [[ "$gradle_version" != "$version" ]]; then
            echo "Extension version ${gradle_version} doesn't match tag version ${version}!"
            exit 1
          fi

          echo "extension=$extension" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_name=${extension^} ${version}" >> "$GITHUB_OUTPUT"

          ./gradlew clean ":extension:$extension:build"

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: "${{ steps.build.outputs.release_name }}"
          prerelease: ${{ contains(steps.build.outputs.version, '-') }}
          artifacts: "extension/${{ steps.build.outputs.extension }}/build/libs/${{ steps.build.outputs.extension }}-${{ steps.build.outputs.version }}.jar"
          # always draft to have a chance to review before publishing
          draft: true
          generateReleaseNotes: true
